<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GCSE Maths Do Now Generator</title>
<style>
  

  :root {
    --navy: #1a2744;
    --teal: #0d9488;
    --amber: #f59e0b;
    --light: #f0f4f8;

  * { box-sizing: border-box; margin: 0; padding: 0; }

  }

    font-size: 0.65rem;

  }

  .row2-divider {

  .app-title {
    font-family: Helvetica, Arial, sans-serif;

  .controls {

  .blank-btn {

  .diff-btn.inactive[data-diff="Intermediate"] { border-color: #d97706; color: #fbbf24 !important; }

/* =====================================================================
   SCREEN UI THEME — header, toolbar, column cards, question cards
   (print / download / full-screen outputs are styled separately)
   ===================================================================== */
:root {
  --ink: #0f172a;
  --ink-soft: #64748b;
  --line: #e3e8f0;
  --surface: #ffffff;
  --canvas: #eef1f6;
  --navy-900: #0b1530;
  --navy-800: #13214a;
  --teal: #0d9488;
  --amber: #f59e0b;
  --font: Inter, "Segoe UI", system-ui, -apple-system, Helvetica, Arial, sans-serif;
}
body {
  font-family: Inter, "Segoe UI", system-ui, -apple-system, Helvetica, Arial, sans-serif;
  background: var(--canvas);
  color: var(--ink);
  -webkit-font-smoothing: antialiased;
}

/* ---- Header ---- */
.app-header {
  position: sticky; top: 0; z-index: 50;
  display: block; padding: 0;
  background: linear-gradient(180deg, var(--navy-900) 0%, var(--navy-800) 100%);
  box-shadow: 0 4px 18px rgba(11,21,48,.25);
}
.topbar {
  display: flex; align-items: center; justify-content: space-between;
  gap: 16px; padding: 14px 28px 12px; flex-wrap: wrap;
}
.brand { display: flex; align-items: center; gap: 14px; }
.brand-bar { width: 5px; height: 38px; border-radius: 3px; background: var(--amber); }
.app-title {
  font-size: 1.55rem; font-weight: 800; letter-spacing: 3px; line-height: 1.05;
  text-transform: uppercase; color: #fff;
}
.app-sub { font-size: .72rem; color: #94a3b8; letter-spacing: .6px; margin-top: 3px; }
.topbar-actions { display: flex; align-items: center; gap: 10px; }

.gen-btn {
  margin: 0; border: none; border-radius: 10px; padding: 10px 26px;
  background: linear-gradient(180deg, #14b8a6, var(--teal)); color: #fff;
  font: 700 .95rem/1 var(--font); letter-spacing: .3px; text-transform: none; cursor: pointer;
  box-shadow: 0 2px 10px rgba(13,148,136,.45);
  transition: transform .1s, box-shadow .15s, filter .15s;
}
.gen-btn:hover { background: linear-gradient(180deg, #2dd4bf, #0f9d90); filter: brightness(1.03); box-shadow: 0 4px 14px rgba(13,148,136,.55); }
.gen-btn:active { transform: translateY(1px) scale(.99); }
.fs-btn {
  border: 1px solid rgba(255,255,255,.3); border-radius: 10px; padding: 9px 18px;
  background: transparent; color: #fff;
  font: 600 .88rem/1 var(--font); letter-spacing: .2px; text-transform: none; cursor: pointer;
  transition: background .15s, border-color .15s;
}
.fs-btn:hover { background: rgba(255,255,255,.12); border-color: rgba(255,255,255,.55); }

/* ---- Toolbar ---- */
.toolbar {
  display: flex; align-items: flex-end; flex-wrap: wrap; gap: 14px 22px;
  padding: 12px 28px 14px;
  background: rgba(255,255,255,.04);
  border-top: 1px solid rgba(255,255,255,.08);
}
.tool-spacer { flex: 1 1 20px; }
.tool-group { display: flex; flex-direction: column; gap: 5px; }
.tool-label {
  font-size: .62rem; font-weight: 700; letter-spacing: 1.2px; text-transform: uppercase;
  color: #8fa2c4; margin: 0;
}
.seg { display: inline-flex; padding: 3px; gap: 2px; border-radius: 10px; background: rgba(255,255,255,.08); }
.qcount-btn {
  min-width: 42px; padding: 6px 14px; border: none; border-radius: 8px;
  background: transparent; color: #cbd5e1; font: 700 .85rem/1 var(--font); cursor: pointer;
  transition: background .15s, color .15s;
}
.qcount-btn.active { background: var(--teal); color: #fff; box-shadow: 0 1px 4px rgba(0,0,0,.25); }

  const map = {'0':'⁰','1':'¹','2':'²','3':'³','4':'⁴','5':'⁵','6':'⁶','7':'⁷','8':'⁸','9':'⁹','-':'⁻'};

  if (n === -1) return '−';

// e.g. trimZ("0.730") → "0.73", trimZ("4.50") → "4.5", trimZ("3.00") → "3"

  const s = String(val);
  if (!s.includes('.')) return s;
  return s.replace(/\.?0+$/, '');
}

}

generators["Number - value of a digit"] = (diff, step = 1) => {
  // Build a number, pick a digit that appears EXACTLY ONCE, ask for its place value.
  // F: integers only, up to 10,000s (up to 5 digits)
  // I: decimals 0.001 to 9.999 (no integer part other than units digit is fine)
  // H: 0.001 to 99,999.999 — mix of large integers with decimal parts

  // Place value labels
  const PLACES = [
    { name: 'ten-thousandths', factor: 0.0001 },
    { name: 'thousandths',     factor: 0.001  },
    { name: 'hundredths',      factor: 0.01   },
    { name: 'tenths',          factor: 0.1    },
    { name: 'units',           factor: 1      },
    { name: 'tens',            factor: 10     },
    { name: 'hundreds',        factor: 100    },
    { name: 'thousands',       factor: 1000   },
    { name: 'ten-thousands',   factor: 10000  },
  ];

  // Build a number from chosen digit positions, ensuring the target digit appears only once.
  // Returns { numStr, digit, placeName }
  function buildNumber(positions) {
    // positions: array of place indices into PLACES[] to include
    // We assign digits 1-9 to each position, ensuring no digit repeats.
    const available = [1,2,3,4,5,6,7,8,9];
    // Shuffle available
    for (let i = available.length-1; i > 0; i--) {
      const j = Math.floor(Math.random()*(i+1));
      [available[i],available[j]] = [available[j],available[i]];
    }
    const digits = available.slice(0, positions.length);

    // Pick one position to be the "target" — its digit will be asked about
    const targetIdx = Math.floor(Math.random()*positions.length);
    const targetDigit = digits[targetIdx];
    const targetPlace = PLACES[positions[targetIdx]];

    // Build the number value
    let value = 0;
    positions.forEach((pi, i) => {
      value += digits[i] * PLACES[pi].factor;
    });

    // Format the number — determine decimal places needed
    const maxDecPlaces = positions.reduce((m, pi) => {
      if (PLACES[pi].factor < 1) {
        const dp = Math.round(-Math.log10(PLACES[pi].factor));
        return Math.max(m, dp);
      }
      return m;
    }, 0);

    let numStr;
    if (maxDecPlaces === 0) {
      numStr = Math.round(value).toLocaleString('en-GB');
    } else {
      numStr = value.toFixed(maxDecPlaces);
    }

    return { numStr, digit: targetDigit, placeName: targetPlace.name };
  }

  if (diff === 'Foundation') {
    // Integers only: 2 to 5 significant digits across units–ten-thousands
    // Use positions from index 4 (units) to 8 (ten-thousands)
    const count = step === 0 ? 2 : step === 1 ? 3 : pick([4,5]);
    const startPos = 4; // units
    // Pick 'count' consecutive positions starting from units upward
    const allPositions = [4,5,6,7,8]; // units to ten-thousands
    // Shuffle and take 'count'
    const shuffled = [...allPositions].sort(() => Math.random()-0.5);
    const positions = shuffled.slice(0, count).sort((a,b)=>a-b);
    const { numStr, digit, placeName } = buildNumber(positions);
    return `What is the value of the ${digit} in ${numStr}?`;

  } else if (diff === 'Intermediate') {
    // Decimals: 0.001 to 9.999 — positions from thousandths (2) to units (4)
    // step 0: 2 decimal places; step 1: 3 decimal places; step 2: integer + decimals
    let positions;
    if (step === 0) {
      // e.g. 4.52 — hundredths + tenths + units (2 or 3 of these)
      const pool = [2,3,4]; // hundredths, tenths, units
      positions = [...pool].sort(() => Math.random()-0.5).slice(0, rnd(2,3)).sort((a,b)=>a-b);
    } else if (step === 1) {
      // e.g. 7.345 — thousandths to units
      const pool = [1,2,3,4]; // thousandths, hundredths, tenths, units
      positions = [...pool].sort(() => Math.random()-0.5).slice(0, rnd(3,4)).sort((a,b)=>a-b);
    } else {
      // e.g. 83.47 — units + tens + tenths + hundredths
      const pool = [2,3,4,5]; // hundredths, tenths, units, tens
      positions = [...pool].sort(() => Math.random()-0.5).slice(0, rnd(3,4)).sort((a,b)=>a-b);
    }
    const { numStr, digit, placeName } = buildNumber(positions);
    return `What is the value of the ${digit} in ${numStr}?`;

  } else {
    // Higher: 0.001 to 99,999.999 — wide range
    // step 0: 3-5 digit integer with up to 2 decimal places
    // step 1: 4-6 digit integer with up to 3 decimal places
    // step 2: mix — some purely decimal, some large integer with decimals
    let positions;
    if (step === 0) {
      const pool = [2,3,4,5,6,7]; // hundredths to thousands
      positions = [...pool].sort(() => Math.random()-0.5).slice(0, rnd(4,5)).sort((a,b)=>a-b);
    } else if (step === 1) {
      const pool = [1,2,3,4,5,6,7,8]; // thousandths to ten-thousands
      positions = [...pool].sort(() => Math.random()-0.5).slice(0, rnd(4,6)).sort((a,b)=>a-b);
    } else {
      const pool = [1,2,3,4,5,6,7,8]; // full range
      positions = [...pool].sort(() => Math.random()-0.5).slice(0, rnd(4,6)).sort((a,b)=>a-b);
    }
    const { numStr, digit, placeName } = buildNumber(positions);
    return `What is the value of the ${digit} in ${numStr}?`;
  }
};

generators["Number - inequalities: list integers"] = (diff, step = 1) => {
  // Returns a compound inequality with integer or decimal bounds.
  // The answer is always a finite list of integers.

  const ltOps  = ['<', '≤'];         // strict / inclusive lower
  const gtOps  = ['>', '≥'];         // strict / inclusive upper
  const mixOps = ['<', '≤'];

  function loOp() { return pick(ltOps); }   // operator after lower bound
  function hiOp() { return pick(gtOps); }   // not needed — we use lo op x op hi

  if (diff === 'Foundation') {
    // Simple: both bounds positive integers, gap of 3–7 so list is short
    // Forms: lo < x < hi  or  lo ≤ x ≤ hi  or mixed
    const lo = rnd(1, 8);
    const hi = lo + rnd(3, 6);
    const op1 = pick(ltOps);   // lo op1 x
    const op2 = pick(ltOps);   // x op2 hi
    return `List all integers that satisfy &nbsp; ${lo} ${op1} x ${op2} ${hi}`;

  } else if (diff === 'Intermediate') {
    // Include negatives and decimals as bounds; still asks for integer list
    const type = pick([0, 1, 2]);

    if (type === 0) {
      // Negative lower bound, positive upper
      const lo = rnd(-5, -1);
      const hi = rnd(1, 6);
      const op1 = pick(ltOps);
      const op2 = pick(ltOps);
      return `List all integers that satisfy &nbsp; ${lo} ${op1} x ${op2} ${hi}`;
    }
    if (type === 1) {
      // Decimal lower bound (e.g. -2.5 or 1.5) — forces thinking about which integers qualify
      const lo = pick([-3.5, -2.5, -1.5, -0.5, 0.5, 1.5, 2.5]);
      const hi = lo + rnd(3, 6);
      const op1 = pick(ltOps);
      const op2 = pick(ltOps);
      const hiDisplay = Number.isInteger(hi) ? hi : hi.toFixed(1);
      return `List all integers that satisfy &nbsp; ${lo} ${op1} x ${op2} ${hiDisplay}`;
    }
    // type === 2: one-sided inequality
    const a = rnd(-3, 4);
    const op = pick(['<', '≤', '>', '≥']);
    if (op === '<' || op === '≤') {
      return `List all integers satisfying &nbsp; x ${op} ${a} &nbsp; where &nbsp; ${a - 5} ≤ x`;
    } else {
      return `List all integers satisfying &nbsp; x ${op} ${a} &nbsp; where &nbsp; x ≤ ${a + 5}`;
    }

  } else {
    // Higher: decimal bounds on both sides, or ax+b form, or open compound
    const type = pick([0, 1, 2]);

    if (type === 0) {
      // Both decimal bounds — pupils must identify correct integers
      const decVals = [-4.5, -3.5, -2.5, -1.5, -0.5, 0.5, 1.5, 2.5, 3.5];
      const lo = pick(decVals);
      const hi = lo + rnd(3, 6);
      const op1 = pick(ltOps);
      const op2 = pick(ltOps);
      const hiDisplay = hi.toFixed(1);
      return `List all integers that satisfy &nbsp; ${lo} ${op1} x ${op2} ${hiDisplay}`;
    }
    if (type === 1) {
      // Expression form: list integers satisfying lo < 2x+1 < hi (find x then list integers)
      // Keep simple so answer is manageable: solve for x first
      const a = pick([2, 3]);
      const b = pick([-2, -1, 1, 2]);
      const lo = rnd(-6, 2);
      const hi = lo + a * rnd(3, 5) + 1;
      const op1 = pick(ltOps);
      const op2 = pick(ltOps);
      const expr = b === 0 ? `${a}x` : b > 0 ? `${a}x + ${b}` : `${a}x − ${Math.abs(b)}`;
      return `List all integers satisfying &nbsp; ${lo} ${op1} ${expr} ${op2} ${hi}`;
    }
    // type === 2: negative coefficient — e.g. list integers: -3 < x ≤ 2.5
    const lo = pick([-5.5, -4.5, -3.5, -2.5, -1.5]);
    const hi = pick([0.5, 1.5, 2.5, 3.5, 4.5]);
    const op1 = pick(ltOps);
    const op2 = pick(ltOps);
    return `List all integers satisfying &nbsp; ${lo} ${op1} x ${op2} ${hi}`;
  }
};

  // I: two or three digit coefficient but answer in correct standard form

  if (diff === 'Foundation') {
    // Only single-digit coefficients: a × 10^n where 1 ≤ a ≤ 9
    const type = pick([0, 1, 2, 3]);

    if (type === 0) {

    const type = pick([0, 1, 2, 3]);

      const coeff = a / (sf === 2 ? 10 : 100);
      const full = (coeff * Math.pow(10, -n)).toFixed(n + sf - 1);
      return `Write ${full} in standard form.`;
    }
    if (type === 2) {
      // Standard form → large number (2 s.f. coefficient)
      const whole = rnd(1, 9);
      const dec = rnd(1, 9);
      const n = rnd(2, 6);
      return `Write &nbsp; ${whole}.${dec} × 10${sup(n)} &nbsp; as an ordinary number.`;
    }
    // Standard form → small number (2 s.f. coefficient)
    const whole = rnd(1, 9);
    const dec = rnd(1, 9);
    const n = rnd(1, 4);
    return `Write &nbsp; ${whole}.${dec} × 10${sup(-n)} &nbsp; as an ordinary number.`;

  } else {
    // Higher: non-standard form inputs — coefficient not between 1 and 10
    // e.g. 340 × 10³ → 3.4 × 10⁵,  0.6 × 10^4 → 6 × 10³
    const type = pick([0, 1, 2, 3]);

    if (type === 0) {
      // Coefficient too large: e.g. 34 × 10^n
      const a = rnd(11, 99);
      const n = rnd(1, 5);
      return `Write &nbsp; ${a} × 10${sup(n)} &nbsp; in standard form.`;
    }
    if (type === 1) {
      // Coefficient too large (3 digits): e.g. 340 × 10^n
      const a = rnd(101, 999);
      const n = rnd(1, 4);
      return `Write &nbsp; ${a} × 10${sup(n)} &nbsp; in standard form.`;
    }
    if (type === 2) {
      // Coefficient too small: e.g. 0.6 × 10^n
      const a = rnd(1, 9);
      const n = rnd(2, 6);
      return `Write &nbsp; 0.${a} × 10${sup(n)} &nbsp; in standard form.`;
    }
    // Coefficient too small: e.g. 0.06 × 10^n
    const a = rnd(1, 9);
    const n = rnd(2, 6);
    return `Write &nbsp; 0.0${a} × 10${sup(n)} &nbsp; in standard form.`;
  }
};

function sfAdd(diff) {

  } else {
    const n=rnd(2,5); const a1=rnd(1,9),a2=rnd(0,9),b1=rnd(1,9),b2=rnd(0,9);
    const aSF=a2>0?`${a1}.${a2}`:`${a1}`; const bSF=b2>0?`${b1}.${b2}`:`${b1}`;
    return `Work out &nbsp; ${aSF} × 10${sup(n)} + ${bSF} × 10${sup(-n+1)}`;

function sfSub(diff) {

function sfDiv(diff) {
  const b=rnd(2,9), q=rnd(2,9);
  const rawA=b*q, digits=rawA.toString().length;

}

generators["Algebra - collecting like terms"] = (diff, step = 1) => {

  function pm(n) { return n >= 0 ? ` + ${n}` : ` − ${Math.abs(n)}`; }

    if (c === 1) return ` + ${t}`;

    } else {

    const e=rnd(1,5), f=rnd(1,5);

      const cStr = ops1 === '−' ? `${c}x` : `${c}x`;
      const dStr = ops3 === '−' ? `${d}y` : `${d}y`;
      return `Simplify &nbsp; ${a}x + ${b}y ${ops1} ${c}x ${ops3} ${d}y`;
    } else {

      return `Simplify &nbsp; ${a}x + ${b}y ${op1} ${c}x ${op2} ${d}y ${op3} ${e}x ${op4} ${f}y`;
    }

    // One variable but with x² and x terms: ax² + bx + cx² − dx
    const a=rnd(2,8), b=rnd(2,7), c=rnd(1,6), d=rnd(1,6);
    const e=rnd(1,5), f=rnd(1,5);
    if (step === 0) {

    } else if (step === 1) {

    } else {

      return `Simplify &nbsp; ${a}x${sup(2)} + ${b}x ${op1} ${c}x${sup(2)} ${op2} ${d}x ${op3} ${e}x${sup(2)} ${op4} ${f}x`;

  }

generators["Algebra - simultaneous equations: non-linear"] = (diff, step = 1) => {
  // Build from known integer solutions so discriminant > 0 and roots are rational
  // System: y = x² + bx + c  and  y = mx + k
  // Choose two integer x-values as the solutions, derive the quadratic from them
  const x1 = rnd(-4, 4);
  let x2;
  do { x2 = rnd(-4, 4); } while (x2 === x1);

  // Linear line: y = mx + k  with small integer gradient
  const m = diff === 'Foundation' ? rnd(1, 3) : rnd(-3, 4);
  const k = diff === 'Foundation' ? rnd(0, 6) : rnd(-5, 6);

  const y1 = m * x1 + k;
  const y2 = m * x2 + k;

  // Quadratic through (x1,y1) and (x2,y2): y = (x−x1)(x−x2) + linear part
  // i.e. y = x² − (x1+x2)x + x1*x2  shifted so it passes through (x1,y1)
  // Actually build quadratic as y = ax² + bx + c using the two intersection points
  // Use a=1, then solve for b,c using the two points and the linear line:
  // y = x² + bx + c  =>  y1 = x1² + b*x1 + c  and  y2 = x2² + b*x2 + c
  // Subtract: y1−y2 = (x1²−x2²) + b(x1−x2)  => b = [(y1−y2)−(x1²−x2²)] / (x1−x2)
  const numerator = (y1 - y2) - (x1 * x1 - x2 * x2);
  const denominator = x1 - x2;
  // denominator ≠ 0 since x1 ≠ x2
  if (numerator % denominator !== 0) {
    // Fallback: regenerate with a simpler setup
    const fx1 = rnd(1, 3);
    const fx2 = -rnd(1, 3);
    const fm = 1;
    const fk = fx1 + fx2 + 2;
    const fb = -(fx1 + fx2);
    const fc = fx1 * fx2;
    const fbStr = fb >= 0 ? ` + ${fb}x` : ` − ${Math.abs(fb)}x`;
    const fcStr = fc >= 0 ? ` + ${fc}` : ` − ${Math.abs(fc)}`;
    const fkStr = fk >= 0 ? `${fk}` : `−${Math.abs(fk)}`;
    return `Solve simultaneously: &nbsp; y = x${sup(2)}${fbStr}${fcStr} &nbsp; and &nbsp; y = x + ${fkStr}`;
  }

  const b = numerator / denominator;
  const c = y1 - x1 * x1 - b * x1;

  // Format the quadratic nicely
  const bStr = b === 0 ? '' : b > 0 ? ` + ${b}x` : ` − ${Math.abs(b)}x`;
  const cStr = c === 0 ? '' : c > 0 ? ` + ${c}` : ` − ${Math.abs(c)}`;
  const mStr = m === 1 ? '' : m === -1 ? '−' : `${m}`;
  const kStr = k === 0 ? '' : k > 0 ? ` + ${k}` : ` − ${Math.abs(k)}`;
  const lineStr = `y = ${mStr}x${kStr}`;

  return `Solve simultaneously: &nbsp; y = x${sup(2)}${bStr}${cStr} &nbsp; and &nbsp; ${lineStr}`;
};

generators["Algebra - inequalities: negative coefficient of x"] = (diff, step = 1) => {
  // All questions have a negative x coefficient, requiring students to flip the inequality
  // e.g.  6 − 3x > 12  →  −3x > 6  →  x < −2
  // Forms: a − bx op c   OR   c op a − bx   OR  a > b − cx (varies by step)

  const ops = ['<', '>', '≤', '≥'];

  function flipOp(o) { return {'>':'<','<':'>','≤':'≥','≥':'≤'}[o]; }

  if (diff === 'Foundation') {

    // Build from answer: pick x_sol, then compute c = a − b*x_sol

    const a = rnd(8, 25);

  } else if (diff === 'Intermediate') {

    if (type === 0) {

      const x_sol = rnd(-3, 5);
      const rhs = a - b * x_sol;
      return `Solve &nbsp; ${a} − ${b}x ${op} ${rhs}`;
    } else if (type === 1) {
      // Form: a − bx op c + d  (constant on both sides)
      // Build from: a − bx = c + d at x_sol → solve for c given a,b,d,x_sol
      const b = pick([2, 3, 4]);
      const a = rnd(6, 20);
      const d = rnd(1, 6);
      const x_sol = rnd(-2, 4);
      const c = a - b * x_sol - d;

      const cAdj = c < 1 ? c + b * 3 : c;

      return `Solve &nbsp; ${aAdj} − ${b}x ${op} ${cAdj} + ${d}`;
    } else {
      // Rearrangement needed first: bx + c op a  where bx term appears on right
      // Written as: d op a − bx

    }

  } else {

    const type = pick([0, 1, 2]);

    if (type === 0) {
      // a − bx op cx + d  (negative net x coefficient: a−d op (b+c)x)
      const b = pick([3, 4, 5]);

      const d = rnd(1, 8);
      const x_sol = rnd(0, 3);

      // Ensure (a−d) divisible by (b+c) for clean answer
      const denom = b + c;
      const numA = rnd(1, 4) * denom + d;
      return `Solve &nbsp; ${numA} − ${b}x ${op} ${c}x + ${d}`;
    } else if (type === 1) {
      // a − bx op c + dx, larger coefficients
      const b = pick([4, 5, 6]);
      const d = pick([1, 2, 3]);
      const denom = b + d;
      const rhs_const = rnd(1, 6);
      const lhs_const = rnd(1, 4) * denom + rhs_const;
      return `Solve &nbsp; ${lhs_const} − ${b}x ${op} ${rhs_const} + ${d}x`;
    } else {
      // With brackets: a(b − cx) op d
      const c = pick([1, 2]);
      const a = pick([2, 3, 4]);
      const b = rnd(4, 10);
      const d = rnd(1, a * b - 2);
      return `Solve &nbsp; ${a}(${b} − ${c}x) ${op} ${d}`;

  }

generators["Algebra - graphs: gradient and intercept given equation"] = (diff, step = 1) => {

  // Shared helpers for graph generators
  function gSign(n) { return n < 0 ? '−' + Math.abs(n) : '' + n; }
  function gMstr(m) {
    if (m === 1) return '';
    if (m === -1) return '−';
    return m < 0 ? '−' + Math.abs(m) : '' + m;
  }
  function gCstr(c) {
    if (c === 0) return '';
    return c > 0 ? ' + ' + c : ' − ' + Math.abs(c);
  }
  function gFrac(n, d) { return frac(n, d); }
  function gFracCstr(n, d) {
    if (n === 0) return '';
    return n > 0 ? ' + ' + gFrac(n,d) : ' − ' + gFrac(Math.abs(n),d);
  }
  // Simplified fraction list
  const FRACS = [[1,2],[1,3],[2,3],[1,4],[3,4],[1,5],[2,5],[3,5],[4,5]];
  function pickFrac(neg) {
    const [n,d] = pick(FRACS);
    return neg ? [-n, d] : [n, d];
  }

  if (diff === 'Foundation') {
    // Integer m and c, y = mx + c
    const m = pick([-5,-4,-3,-2,2,3,4,5,1,-1]);
    const c = rnd(0,8) * pick([-1,1]);
    return `State the gradient and y-intercept of &nbsp; y = ${gMstr(m)}x${gCstr(c)}`;

  } else if (diff === 'Intermediate') {
    // Fractional or decimal m and/or c, y = mx + c
    const useFrac = pick([true, false]);
    if (useFrac) {
      const neg = pick([true, false]);
      const [n, d] = pickFrac(neg);
      const c = rnd(0,6) * pick([-1,1]);
      return `State the gradient and y-intercept of &nbsp; y = ${gFrac(n,d)}x${gCstr(c)}`;
    } else {
      const mVals = [0.5,-0.5,1.5,-1.5,2.5,-2.5,0.25,-0.25,0.75,-0.75];
      const m = pick(mVals);
      const c = pick([0.5,-0.5,1,-1,1.5,-1.5,2,-2,3,-3]);
      const ms = m < 0 ? '−' + Math.abs(m) : '' + m;
      const cs = c === 0 ? '' : c > 0 ? ' + ' + c : ' − ' + Math.abs(c);
      return `State the gradient and y-intercept of &nbsp; y = ${ms}x${cs}`;
    }

  } else {
    // Higher: needs rearranging; at least one of m or c is fractional or negative
    // Forms: y + ax = c, ky = mx + c, ax + ky = c
    const type = pick(['y+ax','ky=mx+c','ax+ky']);
    const m = rnd(1,5) * pick([-1,1]);
    const c = rnd(1,8) * pick([-1,1]);
    if (type === 'y+ax') {
      // y + ax = c  →  y = -ax + c; ensure a and c make a non-trivial problem
      const a = rnd(1,5);
      const rhs = c;
      return `State the gradient and y-intercept of &nbsp; y + ${a}x = ${rhs}`;
    } else if (type === 'ky=mx+c') {
      const k = pick([2,3,4]);
      const km = m * k; const kc = c * k;
      const kms = km < 0 ? '−' + Math.abs(km) : '' + km;
      const kcs = kc > 0 ? ' + ' + kc : ' − ' + Math.abs(kc);
      return `State the gradient and y-intercept of &nbsp; ${k}y = ${kms}x${kcs}`;
    } else {
      // ax + ky = c — use coprime a and k
      const pairs = [[1,2],[1,3],[2,3],[3,2],[1,4],[3,4],[2,5],[3,5]];
      const [a, k] = pick(pairs);
      const asign = pick([-1,1]);

  }
};

generators["Algebra - graphs: find equation given gradient and intercept"] = (diff, step = 1) => {

  function pick2(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
  function gFrac(n,d) { return frac(n, d); }

  if (diff === 'Foundation') {

    return `Write the equation of a line with gradient ${mDisp} and y-intercept ${cDisp}.`;

  } else if (diff === 'Intermediate') {
    // At least one of m or c is fractional
    const [fn, fd] = pick2(FRACS);
    const fneg = pick([-1,1]);

      [0.5,  [[4,6],[6,8],[4,10],[6,10],[8,10],[4,14],[6,14],[8,14],[10,14],[4,16],[6,16]]],
      [1.5,  [[2,4],[4,6],[2,6],[4,8],[2,8],[4,10],[6,8],[2,10],[6,10],[4,14],[2,14]]],

    // Keep resulting values ≤ 50

    const pairs = [
      [[1,2],[1,3]],   // a=1, b=2, c=3  → 1:2:3
      [[1,2],[1,4]],   // a=1, b=2, c=4  → 1:2:4

  }
};

generators["Ratio & proportion - proportion: worded questions"] = (diff, step = 1) => {
  // All questions are inverse proportion (more workers = less time)
  // Always build from workers × days = total work, so answers are always integers (or .5 for H)
  // F: find days given fewer/more workers (integer answers only)
  // I: find number of workers given different days (integer answers only)
  // H: mix of both, some answers can be half-days; slightly larger numbers

  // Curated [workers1, days1] pairs where workers1 × days1 = total work
  // and many factor pairs exist for integer answers
  const scenarios = [
    { who: 'men',       verb: 'build a wall',           total: 20 },
    { who: 'workers',   verb: 'complete a project',     total: 24 },
    { who: 'painters',  verb: 'paint a house',          total: 12 },
    { who: 'builders',  verb: 'lay a path',             total: 18 },
    { who: 'cleaners',  verb: 'clean a building',       total: 20 },
    { who: 'gardeners', verb: 'landscape a garden',     total: 24 },
    { who: 'workers',   verb: 'pack boxes in a factory',total: 30 },
    { who: 'bricklayers','verb': 'build a wall',        total: 36 },
    { who: 'volunteers', verb: 'sort donations',        total: 24 },
    { who: 'engineers',  verb: 'repair a road',         total: 40 },
  ];

  // Get all factor pairs of total (a × b = total, both integers)
  function factorPairs(n) {
    const pairs = [];
    for (let i = 1; i <= Math.sqrt(n); i++) {
      if (n % i === 0) pairs.push([i, n/i]);
    }
    return pairs;
  }

  // Get half-day factor pairs (a × b = total where b is integer or .5)
  function halfFactorPairs(n) {
    const pairs = [];
    for (let a = 1; a <= n; a++) {
      const b = n / a;
      if (b === Math.floor(b) || (b * 2 === Math.floor(b * 2) && b > 0.5)) {
        pairs.push([a, b]);
      }
    }
    return pairs.filter(([a,b]) => a >= 1 && b >= 0.5 && a <= 20 && b <= 20);
  }

  function formatDays(d) {
    if (d === 1) return '1 day';
    if (d === 0.5) return 'half a day';
    if (d % 1 === 0) return `${d} days`;
    return `${d} days`;
  }
  function formatWorkers(w, who) {
    return `${w} ${who}`;
  }

  if (diff === 'Foundation') {
    // Find new number of days — integer answers only
    const sc = pick(scenarios);
    const pairs = factorPairs(sc.total).filter(([w,d]) => w >= 2 && w <= 10 && d >= 2 && d <= 10);
    if (pairs.length < 2) return `It takes 4 workers 5 days to complete a job. How long would it take 10 workers?`;

    // Pick two different pairs
    let p1, p2;
    do { [p1, p2] = [pick(pairs), pick(pairs)]; } while (p1[0] === p2[0]);
    const [w1, d1] = p1[0] < p2[0] ? [p1[0], p1[1]] : [p2[0], p2[1]]; // fewer workers first
    const [w2, d2] = p1[0] < p2[0] ? [p2[0], p2[1]] : [p1[0], p1[1]];

    const askType = pick([0, 1]);
    if (askType === 0) {
      // Give w1 workers taking d1 days, ask for days with w2 workers
      return `It takes ${formatWorkers(w1, sc.who)} ${formatDays(d1)} to ${sc.verb}. How long would it take ${formatWorkers(w2, sc.who)}?`;
    } else {
      // Give w2 workers taking d2 days, ask for days with w1 workers
      return `It takes ${formatWorkers(w2, sc.who)} ${formatDays(d2)} to ${sc.verb}. How long would it take ${formatWorkers(w1, sc.who)}?`;
    }

  } else if (diff === 'Intermediate') {
    // Find new number of workers — integer answers only
    const sc = pick(scenarios);
    const pairs = factorPairs(sc.total).filter(([w,d]) => w >= 2 && w <= 12 && d >= 2 && d <= 12);
    if (pairs.length < 2) return `It takes 6 workers 4 days to complete a job. How many workers are needed to finish in 3 days?`;

    let p1, p2;
    do { [p1, p2] = [pick(pairs), pick(pairs)]; } while (p1[0] === p2[0]);
    const [w1, d1] = p1;
    const [w2, d2] = p2;

    const askType = pick([0, 1]);
    if (askType === 0) {
      // Give w1 and d1, ask how many workers for d2
      return `It takes ${formatWorkers(w1, sc.who)} ${formatDays(d1)} to ${sc.verb}. How many ${sc.who} would be needed to ${sc.verb} in ${formatDays(d2)}?`;
    } else {
      return `It takes ${formatWorkers(w2, sc.who)} ${formatDays(d2)} to ${sc.verb}. How many ${sc.who} would be needed to ${sc.verb} in ${formatDays(d1)}?`;
    }

  } else {
    // Higher: mix of finding days or workers; some answers can be half-days; larger totals
    const higherScenarios = [
      { who: 'workers',    verb: 'complete a project',       total: 30 },
      { who: 'builders',   verb: 'construct a building',     total: 36 },
      { who: 'engineers',  verb: 'repair a road',            total: 40 },
      { who: 'painters',   verb: 'decorate an office block', total: 24 },
      { who: 'cleaners',   verb: 'clean a large building',   total: 45 },
      { who: 'bricklayers',verb: 'build a wall',             total: 48 },
      { who: 'volunteers', verb: 'complete a project',       total: 30 },
    ];
    const sc = pick(higherScenarios);
    const pairs = halfFactorPairs(sc.total).filter(([w,d]) => w >= 2 && w <= 15 && d >= 0.5 && d <= 15);
    if (pairs.length < 2) return `It takes 5 workers 6 days to complete a project. How many workers are needed to finish in 4 days?`;

    let p1, p2;
    do { [p1, p2] = [pick(pairs), pick(pairs)]; } while (p1[0] === p2[0] || p1[1] === p2[1]);
    const [w1, d1] = p1;
    const [w2, d2] = p2;

    const askDays = pick([true, false]);
    if (askDays) {
      return `It takes ${formatWorkers(w1, sc.who)} ${formatDays(d1)} to ${sc.verb}. How long would it take ${formatWorkers(w2, sc.who)}?`;
    } else {
      return `It takes ${formatWorkers(w1, sc.who)} ${formatDays(d1)} to ${sc.verb}. How many ${sc.who} would be needed to ${sc.verb} in ${formatDays(d2)}?`;
    }
  }
};

generators["Geometry & measure - angles: on a straight line, around a point, in a triangle, opposite"] = (diff, step = 1) => {
  // F: multiples of 10; I: multiples of 5; H: any integer
  function randA(diff, lo, hi) {
    if (diff === 'Foundation') {
      const steps = Math.floor((hi - lo) / 10);
      return lo + rnd(0, steps) * 10;
    } else if (diff === 'Intermediate') {
      const steps = Math.floor((hi - lo) / 5);
      return lo + rnd(0, steps) * 5;
    } else {
      return rnd(lo, hi);
    }
  }

  const t = pick(['straight','point','triangle','opposite']);

  if (t === 'straight') {
    const a = randA(diff, 20, 150);
    return `Angles on a straight line: one angle is ${a}°. Find the other angle.`;
  } else if (t === 'point') {
    const a = randA(diff, 60, 150);
    const maxB = Math.min(150, 330 - a); // ensures third angle ≥ 30°
    const b = randA(diff, 30, maxB > 30 ? maxB : 60);
    if (a + b >= 330) return `Angles around a point: two angles are 130° and 100°. Find the third.`;
    return `Angles around a point: two angles are ${a}° and ${b}°. Find the third.`;
  } else if (t === 'triangle') {
    let a, b, c;
    let attempts = 0;
    do {
      a = randA(diff, 20, 100);
      b = randA(diff, 20, 100);
      c = 180 - a - b;
      attempts++;
    } while ((c <= 0 || c >= 180) && attempts < 20);
    if (c <= 0 || c >= 180) return `A triangle has angles 50° and 60°. Find the third angle.`;
    return `A triangle has angles ${a}° and ${b}°. Find the third angle.`;
  } else {
    const a = randA(diff, 20, 85);
    return `Two vertically opposite angles are formed. One is ${a}°. What is the opposite angle?`;
  }
};

generators["Statistics - stem and leaf diagram"] = (diff, step = 1) => {

      leafCounts.push(n);
      remaining -= n;

    stems.forEach((stem, i) => {
      for (let j = 0; j < leafCounts[i]; j++) {
        data.push(stem * 10 + rnd(0, 9));

    const count = rnd(7, 10);

      });
      data.sort((a,b)=>a-b);
      const dataStr = data.map(v => v.toFixed(1)).join(', ');
      return `Draw a stem and leaf diagram for this data:<br>${dataStr}`;
    } else {
      // 3-digit data — values like 123, 245 (stems are hundreds, leaves are tens)

  } else {
    // Higher: back-to-back stem and leaf — two datasets
    const startStem = rnd(2, 6);
    const stems = [startStem, startStem+1, startStem+2];
    const count1 = rnd(5, 8), count2 = rnd(5, 8);

    function makeLeaves(count) {
      let rem = count;
      const leafGroups = [];
      for (let i = 0; i < 3; i++) {
        const max = Math.min(4, rem - (3-i-1));
        const n = i === 2 ? rem : rnd(1, Math.max(1, max));
        leafGroups.push(Array.from({length:n}, () => rnd(0,9)));
        rem -= n;
      }
      return leafGroups;
    }

    const leaves1 = makeLeaves(count1);
    const leaves2 = makeLeaves(count2);
    const label1 = pick(['Group A','Boys','Team 1','Class 1','Set A']);
    const label2 = pick(['Group B','Girls','Team 2','Class 2','Set B']);
    const data1 = stems.flatMap((s,i) => leaves1[i].map(l => s*10+l)).sort((a,b)=>a-b);
    const data2 = stems.flatMap((s,i) => leaves2[i].map(l => s*10+l)).sort((a,b)=>a-b);

    return `Draw a back-to-back stem and leaf diagram.<br>${label1}: ${data1.join(', ')}<br>${label2}: ${data2.join(', ')}`;  
  }
};

generators["Statistics - pictogram"] = (diff, step = 1) => {
  const categories = [
    ['Monday','Tuesday','Wednesday','Thursday','Friday'],
    ['Red','Blue','Green','Yellow'],
    ['Dogs','Cats','Birds','Fish'],
    ['Football','Basketball','Tennis','Cricket'],
    ['Spring','Summer','Autumn','Winter'],
    ['Year 7','Year 8','Year 9','Year 10'],
  ];

  const catGroup = pick(categories);
  const numCats = diff === 'Foundation' ? rnd(3,4) : rnd(3,5);
  const cats = catGroup.slice(0, numCats);

  // Key size: F=2, I=2 or 4, H=3 or 5
  const keySize = diff === 'Foundation' ? 2
                : diff === 'Intermediate' ? pick([2, 4])
                : pick([3, 5]);

  // Frequencies: multiples of keySize, max 20
  const maxMultiple = Math.floor(20 / keySize);
  const freqs = cats.map(() => rnd(1, maxMultiple) * keySize);

  const dataLines = cats.map((cat, i) => `${cat}: ${freqs[i]}`).join('<br>');
  return `Draw a pictogram for this data:<br>${dataLines}`;
};

generators["Statistics - mean"] = (diff, step = 1) => {
  const baseCount = diff==='Foundation'?4:diff==='Intermediate'?5:6;
  const count = baseCount + step;
  const maxVal = diff==='Foundation' ? 15+step*10 : diff==='Intermediate' ? 25+step*15 : 50+step*25;
  const data = Array.from({length:count}, () => rnd(2, maxVal));
  if (step===2 && diff!=='Foundation') {
    const target = rnd(8,15);
    const partialData = data.slice(0,-1);
    const lastVal = target * count - partialData.reduce((a,b)=>a+b,0);
    if (lastVal > 0 && lastVal < maxVal*2) return `The mean of ${count} numbers is ${target}. The first ${count-1} numbers are ${partialData.join(', ')}. Find the last number.`;
  }
  return `Find the mean of: &nbsp; ${data.join(', ')}`;
};

generators["Statistics - median"] = (diff, step = 1) => {
  // Shuffle helper — Fisher-Yates
  function shuffle(arr) {
    const a = [...arr];
    for (let i = a.length-1; i > 0; i--) {
      const j = Math.floor(Math.random()*(i+1));
      [a[i],a[j]] = [a[j],a[i]];
    }
    return a;
  }

  // F: step 0 sorted, step 1 unsorted, step 2 unsorted
  // I: step 0 sorted, step 1 unsorted, step 2 unsorted
  // H: all three unsorted
  const countOdd = diff==='Foundation' ? 5 : 7;
  const countEven = diff==='Foundation' ? 6 : 8;

  if (diff === 'Higher') {
    // All unsorted
    const count = step===0 ? countOdd : countEven;
    const data = shuffle(Array.from({length:count}, () => rnd(2,30)));
    return `Find the median of: &nbsp; ${data.join(', ')}`;

  } else {
    // F and I: step 0 sorted, steps 1 and 2 unsorted
    if (step===0) {
      const data = Array.from({length:countOdd}, () => rnd(2,20)).sort((a,b)=>a-b);
      return `Find the median of: &nbsp; ${data.join(', ')}`;
    } else if (step===1) {
      const data = shuffle(Array.from({length:countEven}, () => rnd(2,20)));
      return `Find the median of: &nbsp; ${data.join(', ')}`;
    } else {
      const data = shuffle(Array.from({length:countEven}, () => rnd(2,20)));
      return `Find the median of: &nbsp; ${data.join(', ')}`;
    }
  }
};

generators["Statistics - mode"] = (diff, step = 1) => {
  const count = diff==='Foundation'?6:8;
  const base = Array.from({length:count-2}, () => rnd(2,15));
  const mode = rnd(2,15); base.push(mode, mode);
  const data = base.sort((a,b)=>a-b);
  return `Find the mode of: &nbsp; ${data.join(', ')}`;
};

generators["Statistics - range"] = (diff, step = 1) => {
  const count = (diff==='Foundation'?4:6) + step;
  const maxVal = 20 + step*20;
  const data = Array.from({length:count}, () => rnd(2, maxVal));
  if (step===2) {
    const sorted = [...data].sort((a,b)=>a-b);
    return `Find the range and state the values it is calculated from: &nbsp; ${data.join(', ')}`;
  }
  return `Find the range of: &nbsp; ${data.join(', ')}`;
};

generators["Statistics - interquartile range"] = (diff, step = 1) => {
  const data = Array.from({length:8}, () => rnd(2,30)).sort((a,b)=>a-b);
  return `Find the interquartile range of: &nbsp; ${data.join(', ')}`;
};

// Fallback generator
function fallbackGenerator(topic, diff) {
  return `[${diff}] Question about: ${topic}`;
}

function generateQuestion(topic, diff, step = 1) {
  const gen = generators[topic];
  let result;
  if (gen) {
    try { result = gen(diff, step); } catch(e) { result = fallbackGenerator(topic, diff); }
  } else {
    result = fallbackGenerator(topic, diff);
  }
  return keepExpressionsTogether(cleanCoeff(result));
}

// Wrap each equation/expression (the parts separated by &nbsp; in the generators)
// in a no-wrap span so it is never split across two lines.
function keepExpressionsTogether(html) {
  if (typeof html !== 'string') return html;
  if (html.indexOf('&nbsp;') === -1) return html;
  if (html.indexOf('<table') !== -1 || html.indexOf('<br') !== -1) return html;

  const parts = html.split(/\s*&nbsp;\s*/);
  if (parts.length < 2 || parts.some(p => p.trim() === '')) return html;

  // If the first piece has no real words, it is itself an expression (e.g. "f(x) = 2x + 1 ...")
  const firstIsExpr = !/[A-Za-z]{3,}/.test(parts[0].replace(/<[^>]*>/g, ''));
  const exprParity = firstIsExpr ? 0 : 1;

  const out = parts.map((p, i) => {
    if (i % 2 !== exprParity) return p;
    const plain = p.replace(/<[^>]*>/g, '');
    // Leave long lists of data (or very long strings) free to wrap so they cannot overflow
    if (plain.length > 38 || (plain.match(/,/g) || []).length > 5) return p;
    return '<span style="white-space:nowrap;">' + p + '</span>';
  });
  return out.join(' &nbsp; ');
}

function populateAreaSelect(col, defaultAreaIdx) {
  const sel = document.getElementById(`${col}-area`);
  sel.innerHTML = '';
  TOPIC_GROUPS.forEach((g, i) => {
    const opt = document.createElement('option');
    opt.value = i;
    opt.textContent = g.area;
    sel.appendChild(opt);
  });
  sel.value = defaultAreaIdx;
}

function updateTopicSelect(col) {
  const areaIdx = parseInt(document.getElementById(`${col}-area`).value);
  const topicSel = document.getElementById(`${col}-topic`);
  topicSel.innerHTML = '';
  TOPIC_GROUPS[areaIdx].topics.forEach(t => {
    const opt = document.createElement('option');
    opt.value = t;
    // strip the area prefix for display (everything after " - ")
    const dash = t.indexOf(' - ');
    opt.textContent = dash >= 0 ? t.slice(dash + 3) : t;
    topicSel.appendChild(opt);
  });
  // update state and regenerate
  generateColumn(col);
}

function populateSelects() {
  // Left: default to first area (Number: Arithmetic)
  populateAreaSelect('left', 0);
  updateTopicSelect('left');
  // Right: default to Algebra: Equations & Inequalities (index 8)
  populateAreaSelect('right', 8);
  updateTopicSelect('right');
}

function setDiff(col, diff) {
  state[col].diff = diff;
  const btns = document.querySelectorAll(`#${col}-diff-btns .diff-btn`);
  btns.forEach(b => {
    b.classList.toggle('inactive', b.dataset.diff !== diff);
  });
}

function regenerateSingle(col, idx) {
  const topic = state[col].topic;
  const diff = state[col].diff;
  if (!topic) return;
  // Try to get a question different from the current one
  const current = state[col].questions[idx];
  let q, attempts = 0;
  do {
    q = generateQuestion(topic, diff, idx);
    attempts++;
  } while (
    attempts < 20 &&
    q.replace(/<[^>]*>/g,'').replace(/\s+/g,' ').trim() ===
    current.replace(/<[^>]*>/g,'').replace(/\s+/g,' ').trim()
  );
  state[col].questions[idx] = q;
  // Animate spin then update text
  const btn = document.querySelector(`#${col}-qs .q-box:nth-child(${idx+1}) .q-refresh`);
  if (btn) {
    btn.classList.add('spinning');
    setTimeout(() => btn.classList.remove('spinning'), 300);
  }
  const textEl = document.querySelector(`#${col}-qs .q-box:nth-child(${idx+1}) .q-text`);
  if (textEl) textEl.innerHTML = q;
}

function renderQuestions(col, questions) {
  const container = document.getElementById(`${col}-qs`);
  container.innerHTML = '';
  questions.forEach((q, i) => {
    const box = document.createElement('div');
    box.className = 'q-box';
    const label = col === 'left' ? String.fromCharCode(97+i)+')' : (i+1)+')';
    box.innerHTML = `<span class="q-num">${label}</span><span class="q-text">${q}</span><button class="q-refresh" title="Regenerate this question" onclick="regenerateSingle('${col}',${i})">&#x21BA;</button>`;
    container.appendChild(box);
  });
}

function generateUniqueQuestions(topic, diff) {
  const perCol = state.questionCount / 2; // 3 or 2
  const questions = [];
  for (let step = 0; step < perCol; step++) {
    // Map step 0/1 to spread across easy/mid/hard when using 2 questions
    const mappedStep = perCol === 2 ? [0, 2][step] : step;
    let q, attempts = 0;
    do {
      q = generateQuestion(topic, diff, mappedStep);
      attempts++;
    } while (
      attempts < 20 &&
      questions.some(existing =>
        existing.replace(/<[^>]*>/g, '').replace(/\s+/g, ' ').trim() ===
        q.replace(/<[^>]*>/g, '').replace(/\s+/g, ' ').trim()
      )
    );
    questions.push(q);
  }
  return questions;
}

function setQuestionCount(n) {
  state.questionCount = n;
  document.getElementById('qcount-6').classList.toggle('active', n === 6);
  document.getElementById('qcount-4').classList.toggle('active', n === 4);
  // Update main preview grid
  const rows = n === 4 ? '1fr 1fr' : '1fr 1fr 1fr';
  document.querySelectorAll('.q-boxes').forEach(el => el.style.gridTemplateRows = rows);
  // Update print-qs grid (main page, not popup)
  document.querySelectorAll('.print-qs').forEach(el => el.style.setProperty('--print-rows', rows));
  // Re-generate if questions already exist
  if (state.left.questions.length > 0) generateAll();
}

function generateColumn(col) {
  const topic = document.getElementById(`${col}-topic`).value;
  const diff = state[col].diff;
  state[col].topic = topic;
  const questions = generateUniqueQuestions(topic, diff);
  state[col].questions = questions;
  renderQuestions(col, questions);
}

function generateAll() {
  ['left','right'].forEach(col => generateColumn(col));
}

function getDate() {
  const d = new Date();
  return d.toLocaleDateString('en-GB', {weekday:'long', day:'numeric', month:'long', year:'numeric'});
}

function getNextSchoolDay() {
  const d = new Date();
  const day = d.getDay(); // 0=Sun, 1=Mon, ..., 5=Fri, 6=Sat
  let daysToAdd = 1;
  if (day === 5) daysToAdd = 3;  // Friday → Monday
  if (day === 6) daysToAdd = 2;  // Saturday → Monday
  d.setDate(d.getDate() + daysToAdd);
  return d.toLocaleDateString('en-GB', {weekday:'long', day:'numeric', month:'long', year:'numeric'});
}

function getYearGroup() {
  const sel = document.getElementById('year-group-select');
  return sel ? sel.value : '';
}

function getBannerTitle(forText) {
  // forText=true returns plain text (for fullscreen textContent)
  const yg = getYearGroup();
  if (!yg) return 'Do Now';

  return 'Do Now <span style="font-size:0.75em;font-weight:400;letter-spacing:4px;vertical-align:middle;">– ' + yg + '</span>';
}

function getTimestamp() {
  const d = new Date();
  const yy = String(d.getFullYear()).slice(2);
  const mm = String(d.getMonth()+1).padStart(2,'0');
  const dd = String(d.getDate()).padStart(2,'0');
  const hh = String(d.getHours()).padStart(2,'0');
  const mi = String(d.getMinutes()).padStart(2,'0');
  return yy + mm + dd + hh + mi;
}

function downloadBlankImage() {
  const lTopic = state.left.topic;
  const rTopic = state.right.topic;
  const lDiff  = state.left.diff;
  const rDiff  = state.right.diff;

  if (!lTopic || !rTopic) {
    alert('Please select topics first!');
    return;
  }

  const dateOpt = document.getElementById('date-select').value;
  let printDate = '';
  if (dateOpt === 'today') {
    printDate = getDate();
  } else if (dateOpt === 'next') {
    printDate = getNextSchoolDay();
  } else if (dateOpt === 'custom') {
    const raw = document.getElementById('custom-date-picker').value;
    if (!raw) {
      alert('Please select a custom date from the calendar, or choose a different option.');
      return;
    }
    const d = new Date(raw + 'T00:00:00');
    printDate = d.toLocaleDateString('en-GB', {weekday:'long', day:'numeric', month:'long', year:'numeric'});
  }
  const yearGroup = getYearGroup();

  // 16:9 at 1920×1080. We render at half size (960×540) then scale:2 → final 1920×1080px PNG.
  const W = 960, H = 540;
  const bannerH = 64;   // px — "Do Now" red banner
  const headerH = 48;   // px — column title/subtitle strip
  const pad = 10;       // px — padding around box area
  const nQB = state.questionCount / 2;
  const boxAreaH = H - bannerH - headerH - pad * 2;
  const boxH = Math.floor((boxAreaH - pad * (nQB - 1)) / nQB);

  const wrapper = document.createElement('div');
  wrapper.style.cssText = 'position:fixed;left:-9999px;top:0;width:' + W + 'px;height:' + H + 'px;overflow:hidden;background:white;font-family:Helvetica,Arial,sans-serif;';

  const emptyBoxes = (labels) => labels.map(l =>
    '<div style="height:' + boxH + 'px;border:2px solid #888;border-radius:4px;padding:8px 12px;display:flex;align-items:flex-start;gap:10px;box-sizing:border-box;">' +
    '<span style="font-size:16pt;font-weight:700;color:#333;flex-shrink:0;line-height:1.2;">' + l + '</span>' +
    '</div>'
  ).join('<div style="height:' + pad + 'px;"></div>');

  wrapper.innerHTML =
    '<div style="width:' + W + 'px;height:' + H + 'px;border:5px solid #000;overflow:hidden;box-sizing:border-box;display:flex;flex-direction:column;">' +
      '<div style="height:' + bannerH + 'px;background:#8b1a1a;color:white;padding:0 36px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;box-sizing:border-box;position:relative;">' +
        '<div style="display:flex;align-items:center;gap:24px;">' +
          '<div style="font-size:56pt;font-weight:800;letter-spacing:10px;text-transform:uppercase;color:white;padding-top:18px;">Do Now</div>' +
          (getYearGroup() ? '<div style="font-size:42pt;font-weight:400;letter-spacing:6px;text-transform:uppercase;color:rgba(255,255,255,0.9);">– ' + getYearGroup() + '</div>' : '') +
        '</div>' +
        '<div style="position:absolute;left:50%;transform:translateX(-50%);font-size:22pt;font-weight:800;letter-spacing:4px;text-transform:uppercase;color:white;white-space:nowrap;">Mark in green pen</div>' +
        (printDate ? '<div style="font-size:22pt;color:rgba(255,255,255,0.9);text-align:right;">' + printDate + '</div>' : '') +
      '</div>' +
      '<div style="display:flex;flex:1;overflow:hidden;">' +
        '<div style="flex:1;display:flex;flex-direction:column;border-right:3px solid #aaa;">' +
          '<div style="height:' + headerH + 'px;padding:0 28px;border-bottom:3px solid #aaa;background:#f4f4f4;display:flex;flex-direction:column;justify-content:center;flex-shrink:0;">' +
            '<div style="font-size:13pt;font-weight:800;text-transform:uppercase;letter-spacing:1px;color:#1a2744;line-height:1.1;">Recap Learning</div>' +
            '<div style="font-size:8.5pt;color:#555;margin-top:2px;">' + lTopic + ' &nbsp;|&nbsp; ' + lDiff + '</div>' +
          '</div>' +
          '<div style="padding:' + pad + 'px;display:flex;flex-direction:column;gap:0;">' + emptyBoxes(Array.from({length:nQB},(_,i)=>String.fromCharCode(97+i)+')')) + '</div>' +
        '</div>' +
        '<div style="flex:1;display:flex;flex-direction:column;">' +
          '<div style="height:' + headerH + 'px;padding:0 28px;border-bottom:3px solid #aaa;background:#f4f4f4;display:flex;flex-direction:column;justify-content:center;flex-shrink:0;">' +
            '<div style="font-size:13pt;font-weight:800;text-transform:uppercase;letter-spacing:1px;color:#1a2744;line-height:1.1;">Prior Knowledge</div>' +
            '<div style="font-size:8.5pt;color:#555;margin-top:2px;">' + rTopic + ' &nbsp;|&nbsp; ' + rDiff + '</div>' +
          '</div>' +
          '<div style="padding:' + pad + 'px;display:flex;flex-direction:column;gap:0;">' + emptyBoxes(Array.from({length:nQB},(_,i)=>(i+1)+')')) + '</div>' +
        '</div>' +
      '</div>' +
    '</div>';

  document.body.appendChild(wrapper);

  const btn = document.getElementById('img-dl-btn');
  btn.textContent = 'Generating\u2026';
  btn.disabled = true;

  html2canvas(wrapper.firstElementChild, {
    scale: 2,
    width: W,
    height: H,
    backgroundColor: '#ffffff',
    useCORS: true,
    logging: false,
  }).then(function(canvas) {
    document.body.removeChild(wrapper);
    btn.textContent = 'Download Image';
    btn.disabled = false;
    const link = document.createElement('a');
    link.download = 'do-now-blank.png';
    link.href = canvas.toDataURL('image/png');
    link.click();
  }).catch(function(err) {
    document.body.removeChild(wrapper);
    btn.textContent = 'Download Image';
    btn.disabled = false;
    alert('Image generation failed: ' + err.message);
  });
}

function openFullscreen() {
  if (state.left.questions.length === 0 || state.right.questions.length === 0) {
    alert('Please generate questions first!');
    return;
  }

  // Set date
  const fsDateOpt = document.getElementById('date-select').value;
  document.getElementById('fs-date').textContent = fsDateOpt === 'next' ? getNextSchoolDay() : fsDateOpt === 'today' ? getDate() : '';
  document.getElementById('fs-title').innerHTML = getBannerTitle();
  // Set grid rows based on question count
  const fsRows = state.questionCount === 4 ? '1fr 1fr' : '1fr 1fr 1fr';
  document.querySelectorAll('.fs-qs').forEach(el => el.style.gridTemplateRows = fsRows);

  // Set subtitles
  document.getElementById('fs-left-subtitle').textContent = state.left.topic + ' | ' + state.left.diff;
  document.getElementById('fs-right-subtitle').textContent = state.right.topic + ' | ' + state.right.diff;

  // Populate questions
  function renderFsQs(containerId, questions) {
    const c = document.getElementById(containerId);
    c.innerHTML = questions.map((q, i) =>
      `<div class="fs-q">
        <div class="fs-q-top">
          <div class="fs-q-inline"><span class="fs-q-label">${containerId==="fs-left-qs" ? String.fromCharCode(97+i)+")" : (i+1)+")"}</span><span class="fs-q-text">${q}</span></div>
        </div>
      </div>`
    ).join('');
  }

  renderFsQs('fs-left-qs', state.left.questions);
  renderFsQs('fs-right-qs', state.right.questions);

  document.getElementById('fullscreen-view').classList.add('active');
  document.body.style.overflow = 'hidden';
}

function closeFullscreen() {
  document.getElementById('fullscreen-view').classList.remove('active');
  document.body.style.overflow = '';
}

function handleDateSelect() {
  const val = document.getElementById('date-select').value;
  const picker = document.getElementById('custom-date-picker');
  picker.style.display = val === 'custom' ? 'inline-block' : 'none';
  if (val === 'custom') picker.focus();
}

// Init
  populateSelects();
// Set default selections
// defaults set in populateSelects()
